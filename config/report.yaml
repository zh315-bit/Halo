# M5 daily report (AGENTS.md §9). All values team_derived unless marked.
night_window:            # the "previous night" for report date D: [D-1 18:00, D 12:00) mission time
  start_hour_prev_day: 18
  end_hour: 12
  min_coverage: 0.8      # readings must cover >= 80 % of the window (up to the cutoff), else in_bed_minutes = null
min_nights_for_baseline: 3        # sleep vs_baseline needs this many earlier nights (else null)
min_mornings_for_baseline: 3      # morning activity vs_baseline_pct needs this many earlier results
morning_window_hours: 4           # team_derived: duty_status = worst debounced status of RESTING readings in
                                  # [cutoff - 4 h, cutoff] (cutoff = morning activity time, else night end)
duty_consecutive: 2               # team_derived: within that window a metric's caution/alert counts only if
                                  # reached on this many consecutive NEW measurements (red flags count at once)
duty_status:                      # §9.4 default mapping (team_derived). "go" renamed "ready" (2026-11-14)
  normal: ready
  caution: caution
  alert: rest
  no_data: caution                # no assessable resting reading in the morning window: never "ready" on missing data (§3.5)
radiation_reference:              # environment only; never changes a crew member's status (§5)
  file: data/radiation_5min.csv
  label: "Historical ISS radiation - May 2024"
  source: "NASA_RadLab_DosTel1_ISS_Columbus (historical, not personal dose)"
  first_date: "2024-05-01"        # mission day 1 -> this date, day 2 -> next date, ... (demo mapping)
  thresholds: config/thresholds/radiation_thresholds.json   # halo_alert_rules, metric observed_dose_accumulated_day_ugy
recommendations:                  # source: team_policy. Fixed sentences, no medical content (AGENTS.md §3.1)
  source: team_policy
  unfavourable_trend: "Discuss the {metric} trend with the flight surgeon at the next contact."
  missing_data: "Take a fresh vitals reading."
  rest: "Follow the flight surgeon’s guidance before resuming duties."
plain_language:                   # team_derived. The report never shows statistics terms to the crew.
  # A watch item "... 79 bpm is 4.7 robust SD above your baseline (72 bpm)." is shown as
  # "... 79 bpm is well above your usual 72 bpm." The word comes from |robust z| (the first band whose
  # `below` is above it; the last band has no limit). z bands start at 2 (caution) and 3 (alert, scoring.yaml).
  deviation_words:
    - {below: 3, word: slightly}
    - {below: 4, word: clearly}
    - {word: well}
  # The LLM rewrite is rejected if it uses any of these (case-insensitive).
  forbidden_terms: ["robust SD", "standard deviation", "std dev", "SD", "z-score", "z score", "sigma", "MAD"]
live:                             # crews fed by real camera scans (POST /api/v1/scan); team_derived
  # duty = worst debounced status of the crew's last `duty_consecutive` scans up to the day's latest scan;
  # red flags of that day's scans count at once. Sleep = self-reported sleep_hours (source: self_report).
  morning_tests: [docking_error_pct, docking_on_target_pct, reaction_median_ms]   # vs median of >= min_mornings earlier scans
  scan_verdict_label: "Scan verdict"
  scan_verdict_note: "The scan page's own result. HALO's duty status is computed separately against your personal baseline."
