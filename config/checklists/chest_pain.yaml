# Converted from sos_checklists_v2.yaml (DRAFT, sourced, NOT medically reviewed). Step text is verbatim.
# Field meanings: halo_agent/sos/protocols.py and AGENTS.md §8.1.
#   type: action | check (condition_changed = YES, a warning sign) | escalate (fires every time reached)
#   next: step id | END.  on_cannot_do / on_condition_changed: step id | escalate | END
#   on_cannot_do: escalate was added where v2 left it unspecified (AGENTS.md §8.3 default: cannot_do escalates).
#   env: steps that don't apply to the mission environment are followed through `next`.
#   source: keys into _sources.yaml; ref = page/section. note = reviewer note (details panel, not an instruction).
#   [N — TBD]: numbers the sources don't give. Do not fill in without a source.
# Medication policy (team_policy): HALO never names a drug or dose.
# JSC-48031 page numbers come from a public OCR copy; verify against the PDF before citing on stage.

protocol_id: chest_pain_v2
symptom: chest_pain
title: "Chest pain or pressure"
review_status: sourced_unreviewed
verified: false
show_vitals: ["heart_rate_bpm", "systolic_bp_mmhg", "diastolic_bp_mmhg", "spo2_pct", "resp_rate_bpm"]
red_flags: ["bp_crisis", "spo2_low"]
start: c0
steps:
  - id: c0
    type: escalate
    text: "Alert the CMO and the flight surgeon now. Don't wait to see if the pain goes away."
    source: ["nasa_medcl", "mlp_heart_attack"]
    ref: "JSC-48031 p.1-36 (contact Surgeon)"
    next: c1
    on_cannot_do: escalate
  - id: c1
    type: action
    env: ["microgravity"]
    text: "Anchor yourself and your crewmate with the restraint belts or handholds before you start."
    source: nasa_medcl
    ref: "JSC-48031 p.1-6 (Patient Restraint)"
    next: c1g
    on_cannot_do: escalate
  - id: c1g
    type: action
    env: ["partial_gravity", "post_landing"]
    text: "Have them sit down and rest."
    source: mlp_heart_attack
    next: c2
    on_cannot_do: escalate
  - id: c2
    type: check
    text: "Do they have a pulse and are they breathing? Press 'condition changed' if NOT."
    source: nasa_medcl
    ref: "JSC-48031 p.1-36"
    next: c3
    on_cannot_do: escalate
    on_condition_changed: c_cpr
  - id: c3
    type: action
    text: "Have them stop all activity and stay as calm as possible. Loosen tight clothing."
    source: mlp_heart_attack
    next: c4
    on_cannot_do: escalate
  - id: c4
    type: action
    text: "Give oxygen with the mask. Don't use forced (triggered) oxygen on someone who is breathing."
    source: nasa_medcl
    ref: "JSC-48031 p.1-36 (provide O2), p.1-11 (oxygen)"
    next: c5
    on_cannot_do: escalate
  - id: c5
    type: action
    text: "Attach the ECG / vitals monitor and record their vitals."
    source: nasa_medcl
    ref: "JSC-48031 p.1-36, p.1-8 (Cardiac Monitoring)"
    note: "HALO shows the latest vitals here; this step is the physical hookup."
    next: c6
    on_cannot_do: escalate
  - id: c6
    type: action
    text: "Medication: follow the onboard Medical Checklist as the flight surgeon directs. HALO does not suggest drugs."
    source: ["team_policy", "nasa_medcl"]
    ref: "JSC-48031 p.1-36 includes a medication step"
    next: c7
    on_cannot_do: escalate
  - id: c7
    type: action
    text: "Stay with them. Don't let them talk you out of getting help."
    source: mlp_heart_attack
    next: c8
    on_cannot_do: escalate
  - id: c8
    type: action
    text: "Recheck pulse and breathing and read the latest vitals every [N — TBD] minutes until the flight surgeon responds."
    source: ["nasa_medcl", "mlp_heart_attack"]
    next: END
    on_cannot_do: escalate
    on_condition_changed: c2
  - id: c_cpr
    type: escalate
    env: ["microgravity"]
    text: "Start CPR. Until the patient is on the medical restraint system, use the Evetts-Russomano method; once restrained, use the handstand method."
    source: ["dglrm_cpr", "nasa_medcl"]
    ref: "DGLRM/ESAM 2020 BLS/ALS recommendations; JSC-48031 p.1-6"
    next: c_cpr_g
    on_cannot_do: escalate
  - id: c_cpr_g
    type: escalate
    env: ["partial_gravity", "post_landing"]
    text: "Start CPR following the onboard procedure. If an AED is available, follow its instructions."
    source: ["nasa_medcl", "mlp_heart_attack"]
    note: "Partial gravity: research suggests manual compressions may be too shallow at lunar gravity. Not validated."
    next: c8
    on_cannot_do: escalate
