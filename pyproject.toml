[project]
name = "halo-agent"
version = "0.0.1"
description = "HALO Agent - astronaut health decision support (NASA Space Apps 2026 prototype, not a medical device)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "python-multipart>=0.0.33",
  "pyyaml>=6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
shell = []  # Phase 2: langgraph, sentence-transformers, faiss-cpu, LLM SDK (provider TBD)
alert = ["twilio>=9"]  # sos-v0: live SMS only (ALERT_MODE=live); dry_run/offline need nothing
llm = ["anthropic>=2.8"]  # shell: Claude via HALO_LLM_PROVIDER=anthropic; without it everything falls back

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
